<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Abfahrten</title>
<style>
  :root { --bg:#0e1a24; --row:#142534; --row2:#112130; --fg:#f2f5f7; --dim:#8fa3b3; --acc:#f5b800; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; justify-content:space-between; align-items:baseline; padding:16px 20px 12px; border-bottom:3px solid var(--acc); }
  h1 { font-size:clamp(20px,4vw,34px); font-weight:700; }
  #uhr { font-size:clamp(20px,4vw,34px); font-variant-numeric:tabular-nums; font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; color:var(--dim); font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:.06em; padding:10px 12px 6px; }
  td { padding:12px; font-size:clamp(17px,3vw,26px); vertical-align:middle; }
  tr:nth-child(odd) td { background:var(--row); }
  tr:nth-child(even) td { background:var(--row2); }
  .linie { width:1%; }
  .badge { display:inline-block; min-width:2.4em; text-align:center; padding:4px 8px; border-radius:6px; font-weight:800; background:#3a5266; color:#fff; }
  .via { display:block; font-size:.62em; color:var(--dim); margin-top:2px; }
  .steig { width:1%; text-align:center; color:var(--dim); }
  .zeit { width:1%; white-space:nowrap; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .zeit.rt::before { content:""; display:inline-block; width:.45em; height:.45em; border-radius:50%; background:#3ddc84; margin-right:.4em; vertical-align:middle; animation:p 2s infinite; }
  .zeit.plan { color:var(--dim); font-weight:500; }
  .sofort { color:var(--acc); }
  @keyframes p { 50% { opacity:.3 } }
  footer { padding:10px 20px; color:var(--dim); font-size:12px; display:flex; justify-content:space-between; }
  .fehler { padding:30px 20px; color:#ff8a80; font-size:18px; }
</style></head>
<body>
<header><h1 id="titel">Abfahrten</h1><div id="uhr"></div></header>
<table><thead><tr><th>Linie</th><th>Ziel</th><th>Steig</th><th style="text-align:right">Abfahrt</th></tr></thead>
<tbody id="liste"></tbody></table>
<div id="fehler" class="fehler" hidden></div>
<footer><span><a href="start.html" style="color:var(--acc);text-decoration:none;font-weight:600">← Alle Abfahrten</a> &nbsp; ● Echtzeit &nbsp; grau = Fahrplan</span><span id="stand"></span></footer>
<script>
const p = new URLSearchParams(location.search);
const stop = p.get("stop") || "66402";
const steig = (p.get("steig") || "B").toUpperCase();  // Standard: nur Steig B; "ALLE" = alle Steige
const n = parseInt(p.get("n") || "12", 10);

// Linienfarben – bei Bedarf an die IVB-Farben anpassen
const FARBEN = { "1":"#d9262e","2":"#00843d","3":"#f39200","5":"#7a4a9e","6":"#00a3e0","STB":"#6b6b6b",
                 "A":"#0077c8","R":"#e30613","C":"#00965e","F":"#8c6d3f","J":"#a05eb5","M":"#e4007c",
                 "O":"#009ee0","T":"#f7a600","W":"#6e8b3d" };

const NAMEN = { "66402":"Kochstraße", "64396":"Terminal Marktplatz", "1187":"Hauptbahnhof", "66403":"Martin-Luther-Platz" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function uhr() { document.getElementById("uhr").textContent =
  new Date().toLocaleTimeString("de-AT", {hour:"2-digit", minute:"2-digit"}); }
setInterval(uhr, 1000); uhr();

async function laden() {
  try {
    const r = await fetch("https://smartinfo.ivb.at/api/JSON/PASSAGE?stopID=" + encodeURIComponent(stop) + "&tmin=0&timestamp=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    const raw = await r.json();
    const d = { name: NAMEN[stop] || ("Haltestelle " + stop),
      abfahrten: raw.map(x => { const s = x.smartinfo || x; return { linie: s.route || "", ziel: s.direction || "",
        via: s.via || "", zeit: s.time || "", echtzeit: s.stat === "PREDICTED", steig: s.plabel || "" }; }) };
    document.getElementById("titel").textContent = d.name;
    document.title = "Abfahrten " + d.name;
    let rows = d.abfahrten;
    if (steig && steig !== "ALLE") rows = rows.filter(a => a.steig.toUpperCase() === steig);
    rows = rows.slice(0, n);
    document.getElementById("liste").innerHTML = rows.map(a => {
      const bg = FARBEN[a.linie.toUpperCase()] || (a.linie.startsWith("N") ? "#1c2f6b" : "#3a5266");
      const sofort = /^0 min$|^jetzt$/i.test(a.zeit);
      return `<tr>
        <td class="linie"><span class="badge" style="background:${bg}">${esc(a.linie)}</span></td>
        <td>${esc(a.ziel)}${a.via ? `<span class="via">${esc(a.via)}</span>` : ""}</td>
        <td class="steig">${esc(a.steig)}</td>
        <td class="zeit ${a.echtzeit ? "rt" : "plan"} ${sofort ? "sofort" : ""}">${esc(a.zeit)}</td></tr>`;
    }).join("") || `<tr><td colspan="4" style="color:var(--dim)">Keine Abfahrten</td></tr>`;
    document.getElementById("fehler").hidden = true;
    document.getElementById("stand").textContent = "Stand " +
      new Date().toLocaleTimeString("de-AT", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  } catch (e) {
    const f = document.getElementById("fehler");
    f.textContent = "Daten konnten nicht geladen werden (" + e.message + "). Neuer Versuch in 30 s. Falls das dauerhaft so bleibt, blockiert die IVB direkte Abfragen von fremden Seiten – dann die Pi-Variante verwenden.";
    f.hidden = false;
  }
}
laden(); setInterval(laden, 30000);
</script>
</body></html>
