<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000084">
<link rel="apple-touch-icon" href="icon.png">
<title>Abfahrt</title>
<style>
  /* Nachbau der ÖBB-Infra-Abfahrtstafel (meine.oebb.at/abfahrtankunft) */
  :root { --navy:#000084; --blau:#0000cd; --gelb:#ffe600; --weiss:#ffffff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  [hidden] { display:none !important; }
  html, body { background:var(--navy); }
  body { color:var(--weiss); font-family:Arial, "Helvetica Neue", Helvetica, sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
         -webkit-text-size-adjust:100%; }

  /* Kopf: Piktogramm · Abfahrt · Departure · Uhr · Logo */
  .kopf { position:relative; height:112px; overflow:hidden; }
  .zeile { position:absolute; left:2px; top:12px; display:flex; align-items:baseline; gap:0; font-size:16.5px; line-height:1; white-space:nowrap; }
  .pikto { display:block; width:15px; height:15px; align-self:center; margin-right:6px; }
  .zeile .de { color:var(--gelb); width:82px; }
  .zeile .en { color:var(--gelb); font-style:italic; width:82px; }
  .zeile .uhr { font-variant-numeric:tabular-nums; }
  .logo { position:absolute; right:10px; top:6px; text-align:right; }
  .logo .marke { display:block; height:62px; width:auto; margin-left:auto; }
  .logo .sub { font-size:13px; font-weight:700; letter-spacing:.14em; margin-top:6px; text-transform:uppercase;
               max-width:60vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Tabelle */
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  col.c-zeit { width:13.5%; } col.c-erw { width:14%; } col.c-zug { width:13%; }
  col.c-nach { width:27%; } col.c-via { width:21.5%; } col.c-steig { width:11%; }
  th { overflow:hidden; white-space:nowrap; text-align:left; font-weight:400; font-size:11px; padding:12px 0 10px 8px; vertical-align:top; line-height:1.15; }
  th i { display:block; margin-top:14px; }
  th.r { text-align:right; padding:12px 10px 10px 0; overflow:visible; direction:rtl; }
  td { padding:0 0 0 8px; height:46px; font-size:14.5px; vertical-align:middle; white-space:nowrap; overflow:hidden; }
  tbody tr:nth-child(odd) td { background:var(--blau); }
  tbody tr:nth-child(even) td { background:var(--navy); }
  .zeit, .erw { font-variant-numeric:tabular-nums; }
  .erw { color:var(--gelb); }
  .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { visibility:hidden; } }
  .zug { overflow:visible; }
  .badge { display:inline-block; min-width:30px; padding:1px 4px; text-align:center; font-weight:700; font-size:13px;
           background:var(--weiss); color:#e30613; vertical-align:middle; line-height:1.25; }
  .nach { padding-left:4px; }
  /* LED-Lauftext wie im Original: was nicht passt, läuft von rechts nach links durch */
  .lz { display:block; overflow:hidden; white-space:nowrap; }
  .lz > .t { display:inline-block; }
  .lz.lauf > .t { animation:lauf var(--d, 8s) linear infinite; will-change:transform; }
  @keyframes lauf { from { transform:translateX(var(--w, 100px)); } to { transform:translateX(-100%); } }
  .via { font-size:20px; line-height:1.1; padding-left:4px; }

  .steig { text-align:right; padding-right:10px; font-size:14.5px; }
  .leer td { text-align:center; height:60px; font-size:15px; }

  .fehler { padding:16px 12px; color:var(--gelb); font-size:14px; line-height:1.4; }
  .stand { padding:8px 12px 14px; font-size:11px; opacity:.55; display:flex; justify-content:space-between; }
  .stand a { color:inherit; }
  pre#debug { white-space:pre-wrap; word-break:break-all; font-size:11px; padding:12px; background:#00004a; }

  /* Breitere Bildschirme: alles etwas größer, wie auf dem Monitor */
  @media (min-width:700px) {
    .kopf { height:150px; } .zeile { font-size:30px; } .zeile .de, .zeile .en { width:150px; } .pikto { width:26px; height:26px; }
    .logo .marke { height:100px; } .logo .sub { font-size:20px; }
    th { font-size:15px; } td, .steig { font-size:22px; height:64px; } .via { font-size:28px; } .badge { font-size:19px; min-width:44px; }
  }
</style></head>
<body>
<div class="kopf"><div class="zeile">
  <a href="start.html" aria-label="Zur Startseite">
    <svg class="pikto" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" fill="#fff"/>
      <path d="M7 4h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 3v4h10V7zm1 7.2a1.2 1.2 0 1 0 0 .1zm8 0a1.2 1.2 0 1 0 0 .1zM8 18l-2 3h2l1.3-2h5.4l1.3 2h2l-2-3z" fill="#000084"/></svg>
  </a>
  <div class="de">Abfahrt</div>
  <div class="en">Departure</div>
  <div class="uhr" id="uhr"></div></div>
  <div class="logo"><img class="marke" src="ivb-logo-weiss.png" alt="IVB"><div class="sub" id="station"></div></div>
</div>

<table>
  <colgroup><col class="c-zeit"><col class="c-erw"><col class="c-zug"><col class="c-nach"><col class="c-via"><col class="c-steig"></colgroup>
  <thead><tr>
    <th>Zeit<i>time</i></th><th>Erwartet<i>estimated</i></th><th>Linie<i>line</i></th>
    <th>Nach<i>to</i></th><th></th><th class="r">Steig<i>platform</i></th>
  </tr></thead>
  <tbody id="liste"></tbody>
</table>
<div id="fehler" class="fehler" hidden></div>
<div class="stand"><a href="start.html">‹ Start</a><span id="stand"></span></div>
<pre id="debug" hidden></pre>

<script>
const p = new URLSearchParams(location.search);
const stop = p.get("stop") || "66402";
const steig = (p.get("steig") || "B").toUpperCase();  // Standard: nur Steig B; "ALLE" = alle Steige
const n = parseInt(p.get("n") || "12", 10);
const linien = (p.get("linie") || "").toUpperCase().split(",").map(x => x.trim()).filter(Boolean);
const debug = p.has("debug");

const NAMEN = { "66402":"Kochstraße", "64396":"Terminal Marktplatz", "1187":"Hauptbahnhof", "66403":"Martin-Luther-Platz" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = d => d.toLocaleTimeString("de-AT", {hour:"2-digit", minute:"2-digit"});

function uhr() { document.getElementById("uhr").textContent =
  new Date().toLocaleTimeString("de-AT", {hour:"2-digit", minute:"2-digit", second:"2-digit"}); }
setInterval(uhr, 1000); uhr();

// Uhrzeit aus einem Wert der IVB-API: "5 min", "0 min", "jetzt", "14:25", ISO-Zeitstempel oder ms
function alsZeit(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return new Date(v > 1e12 ? v : v * 1000);
  const s = String(v).trim();
  let m;
  if (/^(jetzt|sofort|now)$/i.test(s)) return new Date();
  if ((m = s.match(/^(\d+)\s*(min|')/i))) return new Date(Date.now() + parseInt(m[1], 10) * 60000);
  if ((m = s.match(/^(\d{1,2}):(\d{2})$/))) {
    const d = new Date(); d.setHours(+m[1], +m[2], 0, 0);
    if (d - Date.now() < -6 * 3600e3) d.setDate(d.getDate() + 1);   // nach Mitternacht
    return d;
  }
  const t = Date.parse(s);
  return isNaN(t) ? null : new Date(t);
}
// Planzeit suchen, falls die API eine mitliefert (Feldnamen sind nicht dokumentiert)
const PLAN_FELDER = ["plantime", "planTime", "plannedTime", "scheduledTime", "scheduled", "ttime", "timetable", "sollzeit"];
const planVon = s => { for (const k of PLAN_FELDER) if (s[k]) return alsZeit(s[k]); return null; };

async function laden() {
  try {
    const r = await fetch("https://smartinfo.ivb.at/api/JSON/PASSAGE?stopID=" + encodeURIComponent(stop) + "&tmin=0&timestamp=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    const raw = await r.json();
    if (debug) { const d = document.getElementById("debug"); d.hidden = false; d.textContent = JSON.stringify(raw.slice(0, 3), null, 2); }

    const name = NAMEN[stop] || ("Haltestelle " + stop);
    document.getElementById("station").textContent = name + (linien.length ? " · " + linien.join(", ") : "");
    document.title = "Abfahrt " + name;

    let rows = raw.map(x => {
      const s = x.smartinfo || x;
      const ist = alsZeit(s.time), plan = planVon(s);
      return { linie: s.route || "", ziel: s.direction || "", via: s.via || "", steig: s.plabel || "",
               echtzeit: s.stat === "PREDICTED" || s.stat === "ARRIVING",
               ankunft: s.stat === "ARRIVING",
               min: (String(s.time || "").match(/^(\d+)\s*min/i) || [])[1], ist, plan };
    });
    if (steig && steig !== "ALLE") rows = rows.filter(a => a.steig.toUpperCase() === steig);
    if (linien.length) rows = rows.filter(a => linien.includes(a.linie.toUpperCase()));
    rows = rows.slice(0, n);

    const html = rows.map(a => {
      // Wie bei der ÖBB: links die Fahrplanzeit, gelb daneben die erwartete Zeit, wenn sie abweicht
      const soll = a.plan || a.ist;
      // Liefert die IVB Minuten ("4 min"), stehen sie gelb in "Erwartet" – wie am IVB-Screen
      // ARRIVING (Bus fährt ein): "0 min" blinkt
      const blink = a.ankunft || a.min === "0";
      const erw = blink ? '<span class="blink">0 min</span>'
                : a.min != null ? a.min + " min"
                : (a.plan && a.ist && Math.abs(a.ist - a.plan) >= 60000 ? hhmm(a.ist) : "");
      // Vias wie bei der ÖBB: zwei Zeilen, jede mit "~" und abgeschnitten
      const vias = a.via ? a.via.split(/\s*[,;\/]\s*|\s+-\s+/).filter(Boolean) : [];
      const via = vias.slice(0, 2).map((v, i) => `<span class="lz"><span class="t">${esc(v)}${i < vias.length - 1 ? "~" : ""}</span></span>`).join("");
      return `<tr>
        <td class="zeit">${soll ? hhmm(soll) : ""}</td>
        <td class="erw">${erw}</td>
        <td class="zug"><span class="badge">${esc(a.linie)}</span></td>
        <td class="nach"><span class="lz"><span class="t">${esc(a.ziel)}</span></span></td>
        <td class="via">${via}</td>
        <td class="steig">${esc(a.steig)}</td></tr>`;
    }).join("") || `<tr class="leer"><td colspan="6">Keine Abfahrten</td></tr>`;
    // Nur neu zeichnen, wenn sich etwas geändert hat – sonst springen die Lauftexte bei jedem Update zurück
    const liste = document.getElementById("liste");
    if (liste.dataset.html !== html) { liste.innerHTML = html; liste.dataset.html = html; lauftext(); }

    document.getElementById("fehler").hidden = true;
    document.getElementById("stand").textContent = "Stand " +
      new Date().toLocaleTimeString("de-AT", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  } catch (e) {
    const f = document.getElementById("fehler");
    f.textContent = "Daten konnten nicht geladen werden (" + e.message + "). Neuer Versuch in 30 s.";
    f.hidden = false;
  }
}
// Lauftext nur dort, wo der Text nicht in die Zelle passt; Tempo ca. 45 px/s wie eine LED-Anzeige
function lauftext() {
  document.querySelectorAll(".lz").forEach(box => {
    const t = box.firstElementChild;
    box.classList.remove("lauf");
    const w = box.clientWidth, tw = t.scrollWidth;
    if (tw > w + 1) {
      box.style.setProperty("--w", w + "px");
      box.style.setProperty("--d", ((w + tw) / 45).toFixed(1) + "s");
      box.classList.add("lauf");
    }
  });
}
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(lauftext, 200); });
if (document.fonts) document.fonts.ready.then(lauftext);

laden(); setInterval(laden, 30000);
</script>
</body></html>
