<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abfahrten">
<meta name="theme-color" content="#0e1a24">
<link rel="apple-touch-icon" href="icon.png">
<title>Abfahrten</title>
<style>
  :root { --bg:#0e1a24; --card:#152635; --card-hi:#1c3246; --fg:#f2f5f7; --dim:#8fa3b3;
          --ivb:#e30613; --oebb:#d2001e; --vvt:#00965e; --acc:#f5b800; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 16px)
                 calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px);
         min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px;
           padding-bottom:12px; border-bottom:3px solid var(--acc); }
  h1 { font-size:28px; font-weight:800; letter-spacing:-.01em; }
  #uhr { font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; }
  h2 { font-size:13px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.08em;
       margin:22px 2px 10px; display:flex; align-items:center; gap:8px; }
  h2::before { content:""; width:10px; height:10px; border-radius:3px; background:var(--c); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  a.btn { display:flex; flex-direction:column; justify-content:space-between; gap:14px; min-height:92px;
          padding:14px 16px; border-radius:14px; background:var(--card); color:var(--fg); text-decoration:none;
          border-left:5px solid var(--c); transition:transform .08s, background .15s; }
  a.btn:active { transform:scale(.97); background:var(--card-hi); }
  @media (hover:hover) { a.btn:hover { background:var(--card-hi); } }
  .name { font-size:19px; font-weight:700; line-height:1.2; }
  .meta { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--dim); }
  .tag { font-size:11px; font-weight:800; letter-spacing:.04em; padding:3px 7px; border-radius:5px;
         background:var(--c); color:#fff; }
  a.btn.gross { grid-column:1 / -1; min-height:110px; }
  a.btn.gross .name { font-size:24px; }
  .ivb { --c:var(--ivb); } .oebb { --c:var(--oebb); } .vvt { --c:var(--vvt); }
</style>
</head>
<body>
<header><h1>Abfahrten</h1><div id="uhr"></div></header>

<h2 class="ivb">IVB · Innsbruck</h2>
<div class="grid">
  <a class="btn ivb gross" href="./">
    <span class="name">Kochstraße</span>
    <span class="meta">Steig B · Echtzeit <span class="tag">IVB</span></span>
  </a>
  <a class="btn ivb" href="https://smartinfo.ivb.at/screen/1065">
    <span class="name">Hauptbahnhof</span>
    <span class="meta">Bus &amp; Tram <span class="tag">IVB</span></span>
  </a>
</div>

<h2 class="oebb">ÖBB · Bahn</h2>
<div class="grid">
  <a class="btn oebb" href="https://meine.oebb.at/abfahrtankunft/departure?evaNr=8100108&amp;static=true&amp;page=1&amp;offset=0&amp;ignoreIncident=false&amp;contentType=departure">
    <span class="name">Innsbruck Hbf</span>
    <span class="meta">Abfahrt <span class="tag">ÖBB</span></span>
  </a>
  <a class="btn oebb" href="https://meine.oebb.at/abfahrtankunft/departure?evaNr=8100062&amp;static=true&amp;page=1&amp;offset=0&amp;ignoreIncident=false&amp;contentType=departure">
    <span class="name">Imst-Pitztal</span>
    <span class="meta">Abfahrt <span class="tag">ÖBB</span></span>
  </a>
  <a class="btn oebb" href="https://meine.oebb.at/abfahrtankunft/departure?evaNr=8100061&amp;static=true&amp;page=1&amp;offset=0&amp;ignoreIncident=false&amp;contentType=departure">
    <span class="name">Ötztal</span>
    <span class="meta">Abfahrt <span class="tag">ÖBB</span></span>
  </a>
  <a class="btn oebb" href="https://meine.oebb.at/abfahrtankunft/departure?evaNr=8100063&amp;static=true&amp;page=1&amp;offset=0&amp;ignoreIncident=false&amp;contentType=departure">
    <span class="name">Landeck-Zams</span>
    <span class="meta">Abfahrt <span class="tag">ÖBB</span></span>
  </a>
</div>

<h2 class="vvt">VVT · Regionalbus</h2>
<div class="grid">
  <a class="btn vvt" href="https://timeview.vvt.at/#9CCE1E43-5531-4413-A266EDBDDA7AEEAF">
    <span class="name">Trankhütte</span>
    <span class="meta">Abfahrt <span class="tag">VVT</span></span>
  </a>
</div>

<script>
  const uhr = () => document.getElementById("uhr").textContent =
    new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
  uhr(); setInterval(uhr, 1000);
</script>
</body>
</html>
